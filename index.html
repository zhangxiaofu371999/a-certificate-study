    &lt;ol class=&quot;flow&quot;&gt;&lt;li&gt;&lt;strong&gt;定人、定时间、定措施&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;落实整改&lt;/strong&gt; · 重大或紧急危险采取相应控制、停工撤人等措施。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;跟踪复查&lt;/strong&gt; · 报告问题不等于已经整改完成。&lt;/li&gt;&lt;/ol&gt;
    &lt;h3&gt;事故发生：内部报告与对外报告&lt;/h3&gt;
    &lt;ol class=&quot;flow&quot;&gt;&lt;li&gt;&lt;strong&gt;现场有关人员立即报告本单位负责人&lt;/strong&gt;&lt;/li&gt;&lt;li&gt;&lt;strong&gt;负责人立即组织相应应急救援&lt;/strong&gt; · 控制危险，抢救人员，防止扩大。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;按规定向有关部门报告&lt;/strong&gt; · 题库的1小时从负责人接到报告后起算，不是允许现场人员等1小时。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;保护现场和证据&lt;/strong&gt; · 因抢救等需要移动物品，按规定标记和记录。&lt;/li&gt;&lt;/ol&gt;
  &lt;/div&gt;
  &lt;div id=&quot;a-digits-panel&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;a-digits-tab&quot; hidden&gt;
    &lt;h3&gt;数字的记忆结构&lt;/h3&gt;
    &lt;div class=&quot;context-line&quot;&gt;谁 → 什么事项 → 从何时起算／什么条件 → 数字＋单位&lt;/div&gt;
    &lt;div class=&quot;digits&quot;&gt;
      &lt;div class=&quot;digit&quot;&gt;&lt;div class=&quot;digit-value&quot;&gt;1小时&lt;/div&gt;&lt;div&gt;负责人接到事故报告后，按规定向有关部门报告。&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;原题10；现场人员内部报告是“立即”。&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;digit&quot;&gt;&lt;div class=&quot;digit-value&quot;&gt;每年至少1次&lt;/div&gt;&lt;div&gt;施工单位对管理人员、作业人员开展年度安全生产教育培训。&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;原题153；次数不等于培训学时。&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;digit&quot;&gt;&lt;div class=&quot;digit-value&quot;&gt;3年&lt;/div&gt;&lt;div&gt;建筑施工企业安全生产许可证有效期。&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;原题171；企业的证，不是工程施工许可证。&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;digit&quot;&gt;&lt;div class=&quot;digit-value&quot;&gt;期满前3个月&lt;/div&gt;&lt;div&gt;企业按规定提出安全生产许可证延期申请。&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;原题172；记起算点“期满前”。&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;digit&quot;&gt;&lt;div class=&quot;digit-value&quot;&gt;5名及以上&lt;/div&gt;&lt;div&gt;专项施工方案需论证时，专家组人数。&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;原题323；并有相应专业等资格要求。&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;digit&quot;&gt;&lt;div class=&quot;digit-value&quot;&gt;企业 → 项目 → 班组&lt;/div&gt;&lt;div&gt;题库中的三级安全教育层级。&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;原题553；不是三级配电。&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;hr&gt;
    &lt;h3&gt;三组最容易混淆的概念&lt;/h3&gt;
    &lt;ul class=&quot;concept-list&quot;&gt;&lt;li&gt;&lt;strong&gt;企业许可／工程许可／人员资格&lt;/strong&gt;：安全生产许可证／施工许可证／安管人员考核合格证。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;审查／整改／报告&lt;/strong&gt;：监理审查和要求整改；施工方落实整改；报告对象取决于条件。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;培训／交底／方案&lt;/strong&gt;：培训教知识和规矩；交底讲具体作业要求；方案规定如何组织实施。&lt;/li&gt;&lt;/ul&gt;

  &lt;script type=&quot;application/json&quot; id=&quot;a-topics-data&quot;&gt;[{&quot;id&quot;:&quot;actors&quot;,&quot;name&quot;:&quot;01 工程各方：谁负责什么&quot;,&quot;leaves&quot;:[{&quot;id&quot;:&quot;owner&quot;,&quot;name&quot;:&quot;建设单位：组织建工程&quot;,&quot;keys&quot;:[&quot;建设单位&quot;,&quot;建设方&quot;,&quot;业主&quot;,&quot;发包&quot;],&quot;points&quot;:[&quot;建设单位是工程的发起方、业主；建厂房的企业通常就是建设单位。&quot;,&quot;通常依法组织选聘勘察、设计、施工、监理；不同承包方式下组织关系会变化。&quot;,&quot;提供现场和毗邻区域资料；按规定确定、支付有关安全措施费用；组织竣工验收。&quot;],&quot;example&quot;:&quot;你公司请建筑公司建厂房：你公司是建设单位，建筑公司是施工单位。&quot;,&quot;trap&quot;:&quot;建设单位 ≠ 建筑施工企业。甲方、乙方是具体合同中的称呼。&quot;,&quot;refs&quot;:[32,38,39,50,60,609]},{&quot;id&quot;:&quot;survey&quot;,&quot;name&quot;:&quot;勘察与设计：查地、画图&quot;,&quot;keys&quot;:[&quot;勘察&quot;,&quot;设计单位&quot;,&quot;设计文件&quot;,&quot;设计交底&quot;,&quot;图纸会审&quot;],&quot;points&quot;:[&quot;勘察查清土层、地下水等条件，提供满足工程安全需要的勘察文件。&quot;,&quot;设计按法律法规和工程建设强制性标准开展，并在设计文件中提出有关安全指导意见或措施建议。&quot;,&quot;发现设计问题，不能由施工方随意改图；应按规定由设计环节处理。&quot;],&quot;example&quot;:&quot;地基怎么设计，先依靠勘察资料了解地下情况，再由设计单位形成设计。&quot;,&quot;trap&quot;:&quot;画图的是设计单位；特殊建设工程消防设计文件的报送主体是建设单位。&quot;,&quot;refs&quot;:[35,57,610,834]},{&quot;id&quot;:&quot;constructor&quot;,&quot;name&quot;:&quot;施工单位：把安全落实在现场&quot;,&quot;keys&quot;:[&quot;施工单位&quot;,&quot;建筑施工企业&quot;,&quot;施工现场安全&quot;,&quot;施工人员&quot;],&quot;points&quot;:[&quot;施工单位实际组织施工，建立制度，管理人员，开展培训，提供劳动防护。&quot;,&quot;编制并落实施工方案、交底和现场防护，检查并整改隐患。&quot;,&quot;按审查合格的设计文件和技术标准施工，不得擅改设计、偷工减料。&quot;],&quot;example&quot;:&quot;工地缺防护栏，施工方要落实防护，不能等政府来替它装。&quot;,&quot;trap&quot;:&quot;政府检查、监理监督，都不代替施工单位自身的安全责任。&quot;,&quot;refs&quot;:[65,128,145,155,809]},{&quot;id&quot;:&quot;supervisor&quot;,&quot;name&quot;:&quot;监理单位：审查、监督、报告&quot;,&quot;keys&quot;:[&quot;监理&quot;,&quot;总监&quot;],&quot;points&quot;:[&quot;监理受建设单位委托，依法依规履行自己的监理职责。&quot;,&quot;审查施工组织设计中的安全技术措施或专项方案是否符合工程建设强制性标准。&quot;,&quot;隐患要求整改；严重时要求暂时停工并报告建设单位；拒不整改或不停工时及时报告有关主管部门。&quot;],&quot;example&quot;:&quot;施工方提交方案，监理审查；施工方出现严重隐患，监理要求停工并按规定报告。&quot;,&quot;trap&quot;:&quot;发现施工问题：要求施工方改；发现设计问题：报告建设单位要求设计单位改。&quot;,&quot;refs&quot;:[56,57,142,603,838]},{&quot;id&quot;:&quot;government&quot;,&quot;name&quot;:&quot;政府与社会：依法监管、监督&quot;,&quot;keys&quot;:[&quot;主管部门&quot;,&quot;应急管理部门&quot;,&quot;监督管理部门&quot;,&quot;举报&quot;,&quot;工会&quot;,&quot;国务院&quot;,&quot;人民政府&quot;],&quot;points&quot;:[&quot;政府主管部门是依法履职的行政机关，不是建设单位聘请的参建单位。&quot;,&quot;依法开展许可、监督检查、隐患处置和违法行为处理；具体分工按法律与当地安排。&quot;,&quot;工会和社会监督各有作用；发现问题可以依法反映、举报。&quot;],&quot;example&quot;:&quot;监理由业主委托；政府部门按法定职责监管，不需要业主聘请。&quot;,&quot;trap&quot;:&quot;综合安全监管与建设行业监管有分工；看清题目问哪一种。&quot;,&quot;refs&quot;:[4,62,141,593,601]},{&quot;id&quot;:&quot;subcontract&quot;,&quot;name&quot;:&quot;总包与分包：总责、连带、主要责任&quot;,&quot;keys&quot;:[&quot;总承包&quot;,&quot;分包&quot;,&quot;转包&quot;,&quot;挂靠&quot;,&quot;肢解&quot;,&quot;承包单位&quot;],&quot;points&quot;:[&quot;实行施工总承包的，总承包单位对施工现场安全生产负总责。&quot;,&quot;总包与分包对分包工程安全生产承担连带责任；分包应服从总包管理。&quot;,&quot;分包不服从管理导致事故，由分包承担主要责任；不等于总包自动没有责任。&quot;],&quot;example&quot;:&quot;总包把专业工程依法分包出去，仍要进行安全管理。&quot;,&quot;trap&quot;:&quot;违法分包、转包、挂靠是不同情形，不能仅凭‘交别人干’判断。&quot;,&quot;refs&quot;:[157,158,159,288,289,306,307]}]},{&quot;id&quot;:&quot;company&quot;,&quot;name&quot;:&quot;02 A证核心：企业管理与人员&quot;,&quot;leaves&quot;:[{&quot;id&quot;:&quot;abc&quot;,&quot;name&quot;:&quot;A、B、C三类人员与管理层级&quot;,&quot;keys&quot;:[&quot;主要负责人&quot;,&quot;项目负责人&quot;,&quot;项目经理&quot;,&quot;专职安全&quot;,&quot;安管人员&quot;,&quot;法定代表人&quot;],&quot;points&quot;:[&quot;A类主要负责人：本单位安全生产全面负责；B类项目负责人：具体项目安全施工；C类专职人员：安全管理、现场监督检查等。&quot;,&quot;主要负责人管制度、培训、投入、检查治理、应急和报告等企业整体工作。&quot;,&quot;项目负责人把制度和措施落实到项目；专职人员发现隐患报告，发现违章及时制止。&quot;],&quot;example&quot;:&quot;公司制度和资金由企业层面保证；项目安排由项目负责人落实；现场违章由安全管理人员及时制止。&quot;,&quot;trap&quot;:&quot;全面负责、项目负责、现场监督检查是三个不同范围。&quot;,&quot;refs&quot;:[31,156,303,395,531,597,604]},{&quot;id&quot;:&quot;systems&quot;,&quot;name&quot;:&quot;责任制、目标、部门与档案&quot;,&quot;keys&quot;:[&quot;责任制&quot;,&quot;责任制度&quot;,&quot;目标&quot;,&quot;管理机构&quot;,&quot;委员会&quot;,&quot;领导小组&quot;,&quot;部门&quot;,&quot;档案&quot;,&quot;实名制&quot;,&quot;标准化&quot;],&quot;points&quot;:[&quot;安全生产责任制明确各层级、各岗位的职责，是企业安全管理的重要基础。&quot;,&quot;目标管理把总目标分解，落实措施并考核；制度不能只写在纸上。&quot;,&quot;技术、设备、安全、人事等部门分工不同；人员配备、记录和档案按相应规定执行。&quot;],&quot;example&quot;:&quot;谁安排培训、谁管设备、谁检查现场，都应有明确职责和记录。&quot;,&quot;trap&quot;:&quot;安全管理部门不包办所有技术工作；编制安全技术措施和交底要看技术管理职责。&quot;,&quot;refs&quot;:[279,294,299,300,557,558]},{&quot;id&quot;:&quot;training&quot;,&quot;name&quot;:&quot;培训、三级教育、持证上岗&quot;,&quot;keys&quot;:[&quot;培训&quot;,&quot;教育&quot;,&quot;三级&quot;,&quot;上岗&quot;,&quot;操作资格&quot;,&quot;考核合格&quot;],&quot;points&quot;:[&quot;三级安全教育：企业级、项目级、班组级。&quot;,&quot;换岗位、换现场以及采用新技术、新工艺、新设备、新材料，有相应培训要求。&quot;,&quot;安管人员考核与特种作业资格不同；未经培训或考核不合格，不得按规定上岗。&quot;],&quot;example&quot;:&quot;新工人先懂企业规矩，再了解项目危险，最后学具体岗位的安全操作。&quot;,&quot;trap&quot;:&quot;培训不等于取得所有资格；入职培训也不能代替后续专项培训。&quot;,&quot;refs&quot;:[123,125,153,553,554,591,607]},{&quot;id&quot;:&quot;funds&quot;,&quot;name&quot;:&quot;安全投入、专项费用与保险&quot;,&quot;keys&quot;:[&quot;费用&quot;,&quot;投入&quot;,&quot;资金&quot;,&quot;保险&quot;,&quot;保费&quot;,&quot;赔偿&quot;,&quot;劳动合同&quot;,&quot;工伤&quot;,&quot;停工留薪&quot;,&quot;生活自理障碍&quot;,&quot;失能&quot;],&quot;points&quot;:[&quot;建设单位按规定安排、支付相关安全措施费用；施工单位按规定使用。&quot;,&quot;安全费用用于规定的防护、措施、培训、应急准备等事项；具体题目看引用范围。&quot;,&quot;工伤保险、安全生产责任保险和意外伤害保险是不同制度；适用范围与责任主体要分清。&quot;],&quot;example&quot;:&quot;购买安全防护设施与发放普通工资，不能因为都是企业支出就用同一专项资金。&quot;,&quot;trap&quot;:&quot;并非所有单位都一律强制投保安责险；建筑施工属于规定的高危行业领域。&quot;,&quot;refs&quot;:[49,286,518,555,590,612]}]},{&quot;id&quot;:&quot;law&quot;,&quot;name&quot;:&quot;03 法律基础、合同与许可&quot;,&quot;leaves&quot;:[{&quot;id&quot;:&quot;legal-basics&quot;,&quot;name&quot;:&quot;法律层级、关系与权利义务&quot;,&quot;keys&quot;:[&quot;法学&quot;,&quot;法律关系&quot;,&quot;法律渊源&quot;,&quot;宪法&quot;,&quot;法的&quot;,&quot;法律行为&quot;,&quot;民事行为&quot;,&quot;法律效力&quot;,&quot;规范性&quot;,&quot;行政规章&quot;,&quot;标准化法&quot;,&quot;法是&quot;,&quot;法律责任&quot;,&quot;权利能力&quot;,&quot;位阶&quot;,&quot;制定机关&quot;,&quot;工程建设标准&quot;,&quot;强制性标准&quot;,&quot;行业标准&quot;,&quot;法治&quot;],&quot;points&quot;:[&quot;宪法、法律、行政法规、地方性法规、规章和技术标准的来源、地位不同。&quot;,&quot;法律关系通常从主体、客体、内容理解：谁、针对什么、有哪些权利义务。&quot;,&quot;同一事项适用哪条规定，要看法规层级、适用范围、版本和题目条件。&quot;],&quot;example&quot;:&quot;不能把企业自己写的制度与国家法律当成同一效力层级。&quot;,&quot;trap&quot;:&quot;不同法规之间的效力关系，不宜硬排成一条简单直线。&quot;,&quot;refs&quot;:[567,571,572,573,574]},{&quot;id&quot;:&quot;permits&quot;,&quot;name&quot;:&quot;企业资质、企业许可、个人资格&quot;,&quot;keys&quot;:[&quot;许可证&quot;,&quot;资质&quot;,&quot;证书&quot;,&quot;许可&quot;,&quot;延期&quot;,&quot;有效期&quot;],&quot;points&quot;:[&quot;企业资质：允许承接相应工程的资质条件；企业安全生产许可证：安全生产条件。&quot;,&quot;安管人员考核合格证是人的资格；企业许可不是人的A、B、C证。&quot;,&quot;施工许可证是具体工程的开工手续之一，通常由建设单位按规定申请。&quot;],&quot;example&quot;:&quot;企业有安全生产许可证，不代表企业负责人已经取得A证。&quot;,&quot;trap&quot;:&quot;安全生产许可证、施工许可证、人员考核证不能相互代替。&quot;,&quot;refs&quot;:[31,50,171,172,240,683]},{&quot;id&quot;:&quot;contracts&quot;,&quot;name&quot;:&quot;招投标、合同、民事与知识产权&quot;,&quot;keys&quot;:[&quot;合同&quot;,&quot;招标&quot;,&quot;投标&quot;,&quot;中标&quot;,&quot;发包&quot;,&quot;诉讼时效&quot;,&quot;仲裁&quot;,&quot;知识产权&quot;,&quot;商标&quot;,&quot;专利&quot;,&quot;商业秘密&quot;,&quot;著作权&quot;,&quot;不正当竞争&quot;,&quot;民法&quot;],&quot;points&quot;:[&quot;合同中的甲乙方是约定称呼，不是工程法定身份；同一企业在不同合同中身份会变化。&quot;,&quot;依法招标、发包，核对承包资质；不得以违法方式转移工程和资质。&quot;,&quot;合同、诉讼、知识产权题属于法律基础，具体期限和条件按原题核对。&quot;],&quot;example&quot;:&quot;建筑公司在施工合同中通常是乙方，在合法分包合同中可能是甲方。&quot;,&quot;trap&quot;:&quot;‘甲方’不能自动等同于所有场景中的建设单位。&quot;,&quot;refs&quot;:[54,55,306,307,540,541]}]},{&quot;id&quot;:&quot;risk&quot;,&quot;name&quot;:&quot;04 风险、隐患与安全检查&quot;,&quot;leaves&quot;:[{&quot;id&quot;:&quot;risk-source&quot;,&quot;name&quot;:&quot;危险源、风险、事故隐患&quot;,&quot;keys&quot;:[&quot;危险源&quot;,&quot;风险&quot;,&quot;危险因素&quot;,&quot;不安全行为&quot;,&quot;不安全状态&quot;,&quot;事故隐患&quot;,&quot;安全与危险&quot;,&quot;施工危险等级&quot;],&quot;points&quot;:[&quot;危险源是可能造成伤害等后果的来源；风险考虑发生可能性和后果。&quot;,&quot;隐患包括危险状态、不安全行为以及管理缺陷；发现后需要治理。&quot;,&quot;风险识别、分级管控与隐患排查治理相联系，但不是同一概念。&quot;],&quot;example&quot;:&quot;高处作业有坠落风险；临边缺防护是需要整改的隐患。&quot;,&quot;trap&quot;:&quot;有风险不等于已经发生事故；重大危险源与重大事故隐患不是同义词。&quot;,&quot;refs&quot;:[277,278,527,528,727]},{&quot;id&quot;:&quot;inspection&quot;,&quot;name&quot;:&quot;检查类型、评分与带班&quot;,&quot;keys&quot;:[&quot;检查&quot;,&quot;评分&quot;,&quot;保证项目&quot;,&quot;带班&quot;,&quot;巡查&quot;,&quot;评定&quot;,&quot;考核指标&quot;],&quot;points&quot;:[&quot;安全检查包括日常、定期、专项、季节性和不定期抽查等。&quot;,&quot;企业检查与项目现场检查有管理层级，带班要求还涉及具体人员和时间比例。&quot;,&quot;评分标准区分保证项目与一般项目；具体分值和判定条件要连起来记。&quot;],&quot;example&quot;:&quot;雨季专项检查和日常巡查都属于检查，但关注事项和安排不同。&quot;,&quot;trap&quot;:&quot;检查得分、等级阈值和带班比例不能脱离适用人员与标准。&quot;,&quot;refs&quot;:[22,305,348,562,563]},{&quot;id&quot;:&quot;rectification&quot;,&quot;name&quot;:&quot;整改三定、复查、报告与制止&quot;,&quot;keys&quot;:[&quot;整改&quot;,&quot;整治&quot;,&quot;三定&quot;,&quot;制止&quot;,&quot;隐患治理&quot;,&quot;排查治理&quot;,&quot;整改完毕&quot;],&quot;points&quot;:[&quot;整改三定：定人、定时间、定措施；整改后跟踪复查。&quot;,&quot;专职人员发现隐患按规定报告，对违章指挥和操作立即制止。&quot;,&quot;严重隐患要采取对应停工、撤人等措施，不能为了赶工一边冒险一边整改。&quot;],&quot;example&quot;:&quot;发现问题后，要知道谁改、何时完成、采用什么措施，并检查是否改好。&quot;,&quot;trap&quot;:&quot;报告不是整改完成；要求改、落实改、复查确认是不同动作。&quot;,&quot;refs&quot;:[156,564,705,821,838]},{&quot;id&quot;:&quot;signs&quot;,&quot;name&quot;:&quot;安全标志：禁止、警告、指令、提示&quot;,&quot;keys&quot;:[&quot;安全标志&quot;,&quot;安全警示标志&quot;,&quot;标志牌&quot;,&quot;警告标志&quot;,&quot;指令标志&quot;,&quot;提示标志&quot;,&quot;禁止标志&quot;],&quot;points&quot;:[&quot;安全标志用图形、颜色和文字传达禁止、警告、指令或提示等信息。&quot;,&quot;常见对应：禁止用红色、警告用黄色、指令用蓝色、提示用绿色；结合形状和图案辨别。&quot;,&quot;危险位置按规定设置，保证可见和含义准确；标志不能代替实际防护。&quot;],&quot;example&quot;:&quot;“禁止进入”与“必须戴安全帽”分别是禁止和指令，不是同一种标志。&quot;,&quot;trap&quot;:&quot;不能只根据一处颜色判断全部含义；必须穿防护服属于指令，不是警告。&quot;,&quot;refs&quot;:[121,376,377,898,1145,1146,1147]}]},{&quot;id&quot;:&quot;plans&quot;,&quot;name&quot;:&quot;05 危大工程、方案与交底&quot;,&quot;leaves&quot;:[{&quot;id&quot;:&quot;dangerous-work&quot;,&quot;name&quot;:&quot;危大工程与超过一定规模&quot;,&quot;keys&quot;:[&quot;危险性较大&quot;,&quot;超过一定规模&quot;,&quot;危大&quot;,&quot;高大模板&quot;,&quot;深基坑&quot;,&quot;专项施工方案&quot;],&quot;points&quot;:[&quot;危大工程是危险性较大的分部分项工程；达到相应范围需编制专项施工方案。&quot;,&quot;超过一定规模的危大工程还有专家论证等要求。&quot;,&quot;基坑、模板支撑、脚手架、起重等各有范围和阈值，不能用一个数字概括全部。&quot;],&quot;example&quot;:&quot;普通项目与深基坑、高大模板等风险不同，因此方案管理要求也不同。&quot;,&quot;trap&quot;:&quot;需要专项方案 ≠ 全部都要专家论证。&quot;,&quot;refs&quot;:[177,324,566,694]},{&quot;id&quot;:&quot;plan-approval&quot;,&quot;name&quot;:&quot;编制、审核、审查、论证、验收&quot;,&quot;keys&quot;:[&quot;审核&quot;,&quot;审批&quot;,&quot;签字&quot;,&quot;论证&quot;,&quot;专家组&quot;,&quot;验收&quot;,&quot;施工组织设计&quot;],&quot;points&quot;:[&quot;施工单位组织编制方案；按对应规定履行技术审核与监理审查。&quot;,&quot;需要专家论证时由施工单位组织；总承包项目按规定由总包组织。&quot;,&quot;论证不代替审核审查；实施、验收与下一道工序也有相应要求。&quot;],&quot;example&quot;:&quot;方案先形成并履行规定程序，再按批准方案实施，不能边做边补签字。&quot;,&quot;trap&quot;:&quot;问‘谁组织’‘谁审核’‘谁签字’‘谁监督’时，答案可能不同。&quot;,&quot;refs&quot;:[75,149,323,325,448,793,794]},{&quot;id&quot;:&quot;briefing&quot;,&quot;name&quot;:&quot;安全技术交底与现场实施&quot;,&quot;keys&quot;:[&quot;交底&quot;,&quot;操作规程&quot;,&quot;按方案&quot;,&quot;技术措施&quot;],&quot;points&quot;:[&quot;安全技术交底是在作业前把具体危险、措施和操作要求讲清楚。&quot;,&quot;交底应具体、明确、有针对性，按规定签字确认。&quot;,&quot;施工过程按方案和交底实施，专职安全管理人员履行监督职责。&quot;],&quot;example&quot;:&quot;不能只说‘注意安全’，还要讲明这次作业哪里危险、如何防护、异常时怎么办。&quot;,&quot;trap&quot;:&quot;培训、技术交底、方案审核是三个环节，不能互相替代。&quot;,&quot;refs&quot;:[144,300,327,906]}]},{&quot;id&quot;:&quot;accident&quot;,&quot;name&quot;:&quot;06 应急、事故报告与责任&quot;,&quot;leaves&quot;:[{&quot;id&quot;:&quot;emergency&quot;,&quot;name&quot;:&quot;预案、演练、应急资源&quot;,&quot;keys&quot;:[&quot;应急&quot;,&quot;救援&quot;,&quot;演练&quot;,&quot;现场处置&quot;,&quot;救护&quot;,&quot;急救&quot;],&quot;points&quot;:[&quot;预案明确事故情形、组织人员、职责、联系方式、设备调用和处置安排。&quot;,&quot;综合预案、专项预案、现场处置方案的针对性与范围不同。&quot;,&quot;培训和演练检验可执行性，预案需评估并按规定更新。&quot;],&quot;example&quot;:&quot;提前明确谁报警、谁组织撤离、急救物资在哪里，事故时才有可执行安排。&quot;,&quot;trap&quot;:&quot;写好预案不等于具备应急能力；演练频次要看单位与预案类型。&quot;,&quot;refs&quot;:[8,522,523,559,803,904]},{&quot;id&quot;:&quot;reporting&quot;,&quot;name&quot;:&quot;事故报告、抢救与现场保护&quot;,&quot;keys&quot;:[&quot;报告事故&quot;,&quot;事故报告&quot;,&quot;事故现场&quot;,&quot;组织抢救&quot;,&quot;接到报告&quot;,&quot;瞒报&quot;,&quot;谎报&quot;,&quot;迟报&quot;,&quot;漏报&quot;,&quot;现场保护&quot;],&quot;points&quot;:[&quot;现场有关人员立即向本单位负责人报告；单位负责人按规定向有关部门报告。&quot;,&quot;同时组织抢救、控制危险，防止事故扩大和次生灾害。&quot;,&quot;保护现场和证据；为救人等需要移动物品时按规定标记和记录。&quot;],&quot;example&quot;:&quot;先救人、控制危险并及时报告，不能为了赶进度擅自清掉事故现场。&quot;,&quot;trap&quot;:&quot;‘立即报告’与‘负责人接报后1小时内报告’对应不同环节。&quot;,&quot;refs&quot;:[10,147,148,250,560,594]},{&quot;id&quot;:&quot;accident-level&quot;,&quot;name&quot;:&quot;事故等级、调查与四不放过&quot;,&quot;keys&quot;:[&quot;事故等级&quot;,&quot;一般事故&quot;,&quot;较大事故&quot;,&quot;重大事故&quot;,&quot;特别重大&quot;,&quot;事故调查&quot;,&quot;四不放过&quot;,&quot;直接经济损失&quot;,&quot;重伤&quot;,&quot;死亡&quot;],&quot;points&quot;:[&quot;事故等级按规定的死亡、重伤、直接经济损失等条件判断，不能只看某一项。&quot;,&quot;调查查明经过、原因、损失和责任，提出处理及防范措施。&quot;,&quot;四不放过关注原因、责任处理、教育、防范措施；具体原题看完整措辞。&quot;],&quot;example&quot;:&quot;死亡人数不多，但经济损失达到更高等级条件，也不能直接判为低等级。&quot;,&quot;trap&quot;:&quot;‘以上’包含本数，‘以下’是否含本数要按该规定的定义判断。&quot;,&quot;refs&quot;:[167,360,561,1128]},{&quot;id&quot;:&quot;penalties&quot;,&quot;name&quot;:&quot;民事、行政、刑事与处罚数字&quot;,&quot;keys&quot;:[&quot;罚款&quot;,&quot;拘留&quot;,&quot;刑事&quot;,&quot;民事责任&quot;,&quot;行政责任&quot;,&quot;违法&quot;,&quot;处罚&quot;,&quot;停业整顿&quot;,&quot;撤销&quot;,&quot;吊销&quot;,&quot;关闭&quot;,&quot;处分&quot;,&quot;拘役&quot;,&quot;有期徒刑&quot;,&quot;复议&quot;,&quot;诉讼&quot;,&quot;免责&quot;],&quot;points&quot;:[&quot;民事责任常涉及赔偿等；行政责任涉及行政处罚、处理；构成犯罪才涉及刑事责任。&quot;,&quot;同一行为可能同时产生不同责任，不能认为赔钱后其他责任就消失。&quot;,&quot;处罚按行为、主体、后果和适用法规记；题库部分旧引用须与现行规定区别。&quot;],&quot;example&quot;:&quot;企业与个人处罚不同；未整改、发生事故、构成犯罪也对应不同条件。&quot;,&quot;trap&quot;:&quot;先记违法行为，再记处罚；不要脱离题干背金额。&quot;,&quot;refs&quot;:[140,182,183,184,185,575,576]}]},{&quot;id&quot;:&quot;earth&quot;,&quot;name&quot;:&quot;07 土方、基坑、拆除与爆破&quot;,&quot;leaves&quot;:[{&quot;id&quot;:&quot;pit&quot;,&quot;name&quot;:&quot;基坑支护、监测与周边保护&quot;,&quot;keys&quot;:[&quot;基坑&quot;,&quot;支护&quot;,&quot;边坡&qu   &lt;script type=&quot;application/json&quot; id=&quot;a-questions-data&quot;&gt;[{&quot;id&quot;:&quot;q1&quot;,&quot;n&quot;:1,&quot;page&quot;:4,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;根据《安全生产法》规定，安全生产工作坚持以（ ）为中心，树立安全发展理念。\nA.环境\nB.经济\nC.人民\nD.国家&quot;,&quot;answer&quot;:&quot;C&quot;,&quot;leaf&quot;:&quot;other&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q2&quot;,&quot;n&quot;:2,&quot;page&quot;:4,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;根据《安全生产法》规定，安全生产工作要树立安全发展理念，坚持（ ）的方针。\nA.安全第一，预防为主，综合治理\nB.坚持绿色发展\nC.安全生产，人人有责\nD.以人为本，安全发展&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;other&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q3&quot;,&quot;n&quot;:3,&quot;page&quot;:4,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;乡、镇人民政府、街道办事处，一级开发区、工业园区、港区等功能区应该明确负责安全\n生产监督管理的机构，配备（ ）。\nA.专职安全生产管理员\nB.兼职安全生产管理员\nC.专职安全生产执法人员\nD.兼职安全生产执法人员&quot;,&quot;answer&quot;:&quot;C&quot;,&quot;leaf&quot;:&quot;government&quot;,&quot;numeric&quot;:true,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q4&quot;,&quot;n&quot;:4,&quot;page&quot;:4,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;国务院（ ）依照《安全生产法》，对全国安全生产工作实施综合监督管理。\nA.应急管理部门\nB.公安部门\nC.消防部门\nD.建设主管部门&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;government&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q5&quot;,&quot;n&quot;:5,&quot;page&quot;:4,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;负责事故调查的人民政府应当再批复事故调查报告后的（ ）内，组织有关部门对事故整\n改和防范措施落实情况进行评估，并及时向社会公开评估结果。\nA.3 个月\nB.6 个月\nC.一年\nD.三年&quot;,&quot;answer&quot;:&quot;C&quot;,&quot;leaf&quot;:&quot;accident-level&quot;,&quot;numeric&quot;:true,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q6&quot;,&quot;n&quot;:6,&quot;page&quot;:4,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;生产经营单位的主要负责人未履行安全生产管理职责的，责令限期改正，处（）罚款。\nA.1-3 万\n\nB.1-5 万\nC.2-5 万\nD.3-5 万&quot;,&quot;answer&quot;:&quot;C&quot;,&quot;leaf&qu af&quot;:&quot;systems&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q72&quot;,&quot;n&quot;:72,&quot;page&quot;:16,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;（ ）应为工程项目安全生产第一责任人，应负责分解落实安全生产责任，实施考核奖\n惩，实现项目安全管理目标。\nA．项目经理\nB．技术负责人\nC．企业法人\nD．安全总监&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;management-theory&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q73&quot;,&quot;n&quot;:73,&quot;page&quot;:16,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;生产安全事故发生后，（ ）应按规定及时上报。\nA．监理企业\nB．建设单位\nC．设计单位\nD．施工企业&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;survey&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q74&quot;,&quot;n&quot;:74,&quot;page&quot;:16,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;以下（ ）需要组织专家进行论证。\nA．开挖深度达 4 米的基坑支护\n\nB．搭设高度为 6 米的模板支撑工程\nC．搭设跨度达 15 米的模板支撑工程\nD．隧道模&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;plan-approval&quot;,&quot;numeric&quot;:true,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q75&quot;,&quot;n&quot;:75,&quot;page&quot;:17,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;编制的安全专项施工方案应当由（ ）审核签字、加盖单位公章。\nA．施工单位技术负责人\nB．建设单位技术负责人\nC．总监理工程师\nD．设计单位技术负责人&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;dangerous-work&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q76&quot;,&quot;n&quot;:76,&quot;page&quot;:17,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;以下不需要专家进行论证的项目有（ ）。\nA．采用非常规起重设备、方法，且单件起吊重量在 150kN 及以上的起重吊装工程\nB．起重量 300kN 及以上，\nC．搭设基础标高在 160m 及以上的起重机械安装和拆卸工程\nD．搭设总高度 200m 及以上的起重机械安装和拆卸工程&quot;,&quot;answer&quot;:&quot;C&quot;,&quot;leaf&quot;:&quot;plan-approval&quot;,&quot;numeric&quot;:true,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q77&quot;,&quot;n&quot;:77,&quot;page&quot;:17,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;以下不属于勘察设计单位的质量行为要求的是（ ）。\nA．在工程施工前，就审查合格的施工图设计文件向施工单位和监理单位作出详细说明\nB．及时解决施工中发现的勘察、设计问题，参与工程质量事故调查分析\nC．组织图纸会审、设计交底工作\nD．按规定参与施工验槽&quot;,&quot;answer&quot;:&quot;C&quot;,&quot;leaf&quot;:&quot;survey&quot;,&quot;numeric&quot;:true,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q78&quot;,&quot;n&quot;:78,&quot;page&quot;:17,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;以下（ ）不是施工单位的质量行为。\nA．按施工技术标准进行施工\nB．做好隐蔽工程质量检查和记录\nC．做好检验批、分项工程、分部工程的质量报验工作\nD．对有重大修改、变动的施工图设计文件应当重新进行报审&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;constructor&quot;,&quot;numeric&quot;:true,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q79&quot;,&quot;n&quot;:79,&quot;page&quot;:17,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;专项施工方案实施前，（ ）应当向施工现场管理人员进行方案交底。\nA．项目经理\nB．技术负责人\nC．企业高管\nD．监理工程师&quot;,&quot;answer&quot;:&quot;B&quot;,&quot;leaf&quot;:&quot;dangerous-work&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q80&quot;,&quot;n&quot;:80,&quot;page&quot;:17,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;施工单位应当对危大工程施工作业人员进行登记，（ ）应当在施工现场履职。\nA．项目负责人\nB．企业技术负责人\nC．项目技术负责人\n\nD．工长&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;constructor&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q81&quot;,&quot;n&quot;:81,&quot;page&quot;:18,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;对于按照规定需要进行第三方监测的危大工程，（ ）应当委托具有相应勘察资质的单\n位进行监测。\nA．建设单位\nB．设计单位\nC．施工单位\nD．监理单位&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;survey&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q82&quot;,&quot;n&quot;:82,&quot;page&quot;:18,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;以下危大工程需要专家进行论证的是（ ）。\nA．搭设高度 24m 的落地式钢管脚手架工程\nB．提升高度在 100m 的附着式升降脚手架工程\nC．提升高度在 100m 的附着式升降操作平台工程\nD．分段架体搭设高度 30m 的悬挑式脚手架工程&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;dangerous-work&quot;,&quot;numeric&quot;:true,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q83&quot;,&quot;n&quot;:83,&quot;page&quot;:18,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;施工起重机械和整体提升脚手架、模板等自升式架设设施的使用达到国家规定的检验检\n测期限的，必须经（ ）检测。经检测不合格的，不得继续使用。\nA．特种设备检查机构\nB．具有专业资质的检验检测机构\nC．安监站\nD．监理单位&quot;,&quot;answer&quot;:&quot;B&quot;,&quot;leaf&quot;:&quot;scaffold-structure&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q84&quot;,&quot;n&quot;:84,&quot;page&quot;:18,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;（ ）应当由取得相应执业资格的人员担任，对建设工程项目的安全施工负责，落实安\n全生产责任制度。\nA．建设单位项目负责人\nB．施工单位项目负责人\nC．总监理工程师\nD．施工单位安全总监&quot;,&quot;answer&quot;:&quot;B&quot;,&quot;leaf&quot;:&quot;systems&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q85&quot;,&quot;n&quot;:85,&quot;page&quot;:18,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;特种作业人员，必须按照国家有关规定经过专门的安全作业培训，并取得特种作业操作\n资格证书后，方可上岗作业。以下（ ）不属于特种作业人员。\nA．垂直运输机械作业人员\nB．安装拆卸工\nC．起重信号工\nD．登高人员&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;training&quot;,&quot;numeric&quot;:true,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q86&quot;,&quot;n&quot;:86,&quot;page&quot;:18,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;施工单位应当对管理人员和作业人员每年至少进行（ ）次安全生产教育培训，其教育\n培训情况记入个人工作档案，安全生产教育培训考核不合格的人员，不得上岗。\n\nA．一\nB．二\nC．三\nD．四&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;training&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q87&quot;,&quot;n&quot;:87,&quot;page&quot;:19,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;在施工中发生危及人身安全的紧急情况时，作业人员有权（ ）。\nA．立刻报告施工单位\nB．立刻报告建设单位\nC．立即停止作业或者在采取必要的应急措施后撤离危险区域\nD．立即报告政府主管部门&quot;,&quot;answer&quot;:&quot;C&quot;,&quot;leaf&quot;:&quot;management-theory&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q88&quot;,&quot;n&quot;:88,&quot;page&quot;:19,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;对达到一定规模的危险性较大的分部分项工程编制专项施工方案，需附具安全验算结果，\n经施工单位技术负责人、总监理工程师签字后实施，由（ ）进行现场监督。\nA．建设单位技术负责人\nB．施工项目负责人\nC．监理工程师\nD．专职安全生产管理人员&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;dangerous-work&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q89&quot;,&quot;n&quot;:89,&quot;page&quot;:19,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;法是体现统治阶级意志，由国家制定或认可，受（ ）保证实施的行为规则的总称。\nA．国家机器\nB．国家强制力\nC．公民\nD．社会舆论&quot;,&quot;answer&quot;:&quot;B&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q90&quot;,&quot;n&quot;:90,&quot;page&quot;:19,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;从法学的角度来说，法的本质是统治阶级（ ）的工具。\nA．实现阶级统治\nB．国家扩张\nC．打击犯罪\nD．调整社会经济关系&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q91&quot;,&quot;n&quot;:91,&quot;page&quot;:19,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;我国社会主义法的本质在于它的阶级本性，即它是工人阶级领导下的（ ）共同意志的\n体现。\nA．全体工商业者\nB．工人和农民\nC．国内外华人\nD．全国人民&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q92&quot;,&quot;n&quot;:92,&quot;page&quot;:19,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;法的作用，又称法的功能，泛指法对个人以及社会发生影响的体现，包含（ ）和法的\n\n社会作用两方面内容。\nA．法的调节作用\nB．法的人文作用\nC．法的学术作用\nD．法的规范作用&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q93&quot;,&quot;n&quot;:93,&quot;page&quot;:20,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;法的渊源在法学中是一个非常重要的概念，法学上通常所说的法的渊源是指形式意义上\n的渊源，即法律规范的（ ）。\nA．立法背景\nB．效力来源和表现形式\nC．立法依据\nD．立法程序和依据&quot;,&quot;answer&quot;:&quot;B&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q94&quot;,&quot;n&quot;:94,&quot;page&quot;:20,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;宪法是由（ ）制定和修改的居于最高的、核心的地位的根本大法。\nA．最高国家行政机关\nB．最高国家司法机关\nC．国务院\nD．最高国家权力机关&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q95&quot;,&quot;n&quot;:95,&quot;page&quot;:20,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;狭义的法律，是指（ ）按照法定程序制定的规范性文件，是行政法规、地方性法规、\n行政规章的立法依据或者基础。\nA．全国人民代表大会及其常务委员会\nB．县级以上人民代表大会及其常务委员会\nC．国务院\nD．县级以上人民政府&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:true,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q96&quot;,&quot;n&quot;:96,&quot;page&quot;:20,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;法律关系是指法律规范在调整人们行为过程中形成的（ ）关系，是社会关系的一种形\n式。\nA．债权债务\nB．职责、权利\nC．权利义务\nD．民事、经济&quot;,&quot;answer&quot;:&quot;C&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q97&quot;,&quot;n&quot;:97,&quot;page&quot;:20,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;从法律关系主体应具备的能力来讲，限制行为能力，是指行为能力受限制的自然人只有\n不完全的行为能力的资格，即只有部分的行为能力。我国司法实践中通常以（ ）的人为限\n制行为能力的人。\nA．未满 18 周岁\nB．满 8 周岁未满 18 周岁\nC．满 8 周岁未满 16 周岁\n\nD．未满 16 周岁&quot;,&quot;answer&quot;:&quot;B&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:true,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q98&quot;,&quot;n&quot;:98,&quot;page&quot;:21,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;法律责任，又称违法责任，是指法律关系主体由于其（ ），按照法律、法规规定必须\n承担的消极法律后果。\nA．存在违法意识\nB．行为违法\nC．行为违纪\nD．行为不道德&quot;,&quot;answer&quot;:&quot;B&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q99&quot;,&quot;n&quot;:99,&quot;page&quot;:21,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;违宪责任，是指有关国家机关制定的某种法律和法规、规章，或者有关国家机关、社会\n组织或公民的活动与（ ）规定相抵触而产生的法律责任。\nA．宪法\nB．法律\nC．宪法或法律\nD．法律及行政法规&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q100&quot;,&quot;n&quot;:100,&quot;page&quot;:21,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;刑事责任是指法律关系主体违反（ ），所应承担的应当给予刑罚制裁的法律责任。\nA．行政法规定\nB．宪法规定\nC．违反民法规定\nD．国家刑事法律规范&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q101&quot;,&quot;n&quot;:101,&quot;page&quot;:21,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;承担行政责任的主体是行政主体和行政相对人。行政主体是指拥有行政管理职权的\n（ ）。\nA．行政机关\nB．行政机关的工作人员\nC．行政机关及其工作人员\nD．司法机关及其工作人员&quot;,&quot;answer&quot;:&quot;C&quot;,&quot;leaf&quot;:&quot;penalties&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q102&quot;,&quot;n&quot;:102,&quot;page&quot;:21,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;行政相对人是指负有遵守行政法义务的（ ）。\nA．行政机关的工作人员\nB．法定代表人\nC．自然人和法定代表人\nD．公民和法人&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;abc&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q103&quot;,&quot;n&quot;:103,&quot;page&quot;:21,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;法律责任的免除，也称免责，是指法律责任由于（ ）被部分或全部地免除。\nA．法律修订\nB．出现法定条件\n\nC．责任人请求\nD．行政领导批复&quot;,&quot;answer&quot;:&quot;B&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q104&quot;,&quot;n&quot;:104,&quot;page&quot;:22,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;法律责任的免除，也称免责，是指法律责任由于出现法定条件被部分或全部地免除。其\n中，时效免责即法律责任经过了（ ）而免除。\nA．2 年以上期限\nB．法定期限\nC．一定的期限\nD．10 年以上期限&quot;,&quot;answer&quot;:&quot;B&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:true,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q105&quot;,&quot;n&quot;:105,&quot;page&quot;:22,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;法律制裁是指（ ）对违法者依法追究其应承担的法律责任所实施的惩罚性强制措施。\nA．国家行政机关\nB．国家特定机关\nC．司法机关\nD．公安机关&quot;,&quot;answer&quot;:&quot;B&quot;,&quot;leaf&quot;:&quot;legal-basics&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q106&quot;,&quot;n&quot;:106,&quot;page&quot;:22,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;违宪制裁实施的机关是（ ）。\nA．国务院\nB．国家特定机关\nC．最高人民法院\nD．全国人民代表大会及其常委会&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;contracts&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q107&quot;,&quot;n&quot;:107,&quot;page&quot;:22,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;刑事制裁也称刑罚，是（ ）对犯罪行为实施的惩罚措施。\nA．公安机关\nB．人民法院\nC．人民检察院\nD．国家行政机关&quot;,&quot;answer&quot;:&quot;B&quot;,&quot;leaf&quot;:&quot;penalties&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q108&quot;,&quot;n&quot;:108,&quot;page&quot;:22,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;刑罚的种类分为主刑和附加刑。其中主刑的种类有（ ）、拘役、有期徒刑、无期徒刑\n和死刑。\nA．管制\nB．警告\nC．行政拘留\nD．罚金&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;penalties&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q109&quot;,&quot;n&quot;:109,&quot;page&quot;:22,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;下列说法中，错误的是（ ）。\nA．《中华人民共和国安全生产法》是为了加强安全生产监督管理而制定。\nB．《中华人民共和国安全生产法》是为了防止和减少生产安全事故而制定。\n\nC．《中华人民共和国安全生产法》是为了保障人民群众生命和财产安全而制定。\nD．《中华人民共和国安全生产法》是为了保障我国的国家安全而制定。&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;other&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q110&quot;,&quot;n&quot;:110,&quot;page&quot;:23,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;建筑安全生产法规调整的对象是指由建筑安全生产法规调整的、在建筑活动中形成的以\n（ ）为核心的各种关系。\nA．权利与职责\nB．职责与义务\nC．经济利益\nD．权利和义务&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;other&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q111&quot;,&quot;n&quot;:111,&quot;page&quot;:23,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;在《安全生产法》出台之前的一段时间内，（ ）是规范我国建筑工程安全生产的惟一\n一部法律\nA．《劳动法》\nB．《消防法》\nC．《建筑法》\nD．《特种设备安全法》&quot;,&quot;answer&quot;:&quot;C&quot;,&quot;leaf&quot;:&quot;machine-lifecycle&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q112&quot;,&quot;n&quot;:112,&quot;page&quot;:23,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;（ ）是我国安全生产领域的综合性基本法，是我国安全生产监督与管理正式纳入法制\n化管理轨道的重要标志。\nA．《建设工程安全生产管理条例》\nB．《劳动法》\nC．《建筑法》\nD．《安全生产法》&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;other&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q113&quot;,&quot;n&quot;:113,&quot;page&quot;:23,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;（ ）是我国第一部规范建设工程安全生产的行政法规，标志着我国建设工程安全生产\n管理进入了法制化、规范化发展的新时期。\nA．《建设工程安全生产管理条例》\nB．《安全生产许可证条例》\nC．《建筑法》\nD．《安全生产法》&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;permits&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q114&quot;,&quot;n&quot;:114,&quot;page&quot;:23,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;《安全生产法》明确了现阶段安全生产监管体制，即（ ）的体制。\nA．国家安全生产综合监管与各级政府有关职能部门专项监管相结合\nB．国家安全生产综合监管与社会中介机构服务相结合\nC．各级政府有关职能部门专项监管与社会中介机构服务相结合\nD．国家安全生产综合监管与生产经营单位自管相结合&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;systems&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q115&quot;,&quot;n&quot;:115,&quot;page&quot;:23,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;《安全生产法》明确了安全生产三大目标，即（ ），保障人民群众生命和财产安全，\n\n促进经济社会持续健康发展。\nA．保护环境卫生\nB．防止和减少生产安全事故\nC．保证产品质量\nD．健全安全生产体系&quot;,&quot;answer&quot;:&quot;B&quot;,&quot;leaf&quot;:&quot;systems&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q116&quot;,&quot;n&quot;:116,&quot;page&quot;:24,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;下列监督方式中，不属于《安全生产法》规定的安全生产监督方式的是（ ）。\nA．工会民主监督\nB．社会舆论监督\nC．公众举报监督\nD．中介机构监督&quot;,&quot;answer&quot;:&quot;D&quot;,&quot;leaf&quot;:&quot;government&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[]},{&quot;id&quot;:&quot;q117&quot;,&quot;n&quot;:117,&quot;page&quot;:24,&quot;type&quot;:&quot;单选&quot;,&quot;body&quot;:&quot;我国最早的一部《安全生产法》是（ ）年制定的，从那时至今已经已经进行了数次修\n订。\nA．1999 年\nB．2002 年\nC．2014 年\nD．2016 年&quot;,&quot;answer&quot;:&quot;B&quot;,&quot;leaf&quot;:&quot;other&quot;,&quot;numeric&quot;:true,&quot;flags&quot;:[&quot;原题含较早法规版本或旧机构名称；参考答案保留原文，现 ;:&quot;small-machines&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[&quot;原PDF存在相同题号的其他条目；用PDF页码区别&quot;]},{&quot;id&quot;:&quot;q1311&quot;,&quot;n&quot;:1212,&quot;page&quot;:190,&quot;type&quot;:&quot;判断&quot;,&quot;body&quot;:&quot;液压泵在每日启动发动机工作时，应先怠速运转一段时间后，再操纵各执行元件工作，\n这样有利于液压泵的使用。&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;small-machines&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[&quot;原PDF存在相同题号的其他条目；用PDF页码区别&quot;]},{&quot;id&quot;:&quot;q1312&quot;,&quot;n&quot;:1213,&quot;page&quot;:190,&quot;type&quot;:&quot;判断&quot;,&quot;body&quot;:&quot;用柴油清洗推铺机时，不得接近明火。&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;small-machines&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[&quot;原PDF存在相同题号的其他条目；用PDF页码区别&quot;]},{&quot;id&quot;:&quot;q1313&quot;,&quot;n&quot;:1214,&quot;page&quot;:190,&quot;type&quot;:&quot;判断&quot;,&quot;body&quot;:&quot;盾构机上所有表示安全和危险的标识必须完整，并容易识别。&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;underground&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[&quot;原PDF存在相同题号的其他条目；用PDF页码区别&quot;]},{&quot;id&quot;:&quot;q1314&quot;,&quot;n&quot;:1215,&quot;page&quot;:190,&quot;type&quot;:&quot;判断&quot;,&quot;body&quot;:&quot;水泥混凝土摊铺机机器发生故障时，应停机检修，不得边工作边检修，以免发生意外。&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;formwork&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[&quot;原PDF存在相同题号的其他条目；用PDF页码区别&quot;]},{&quot;id&quot;:&quot;q1315&quot;,&quot;n&quot;:1216,&quot;page&quot;:190,&quot;type&quot;:&quot;判断&quot;,&quot;body&quot;:&quot;轮胎式起重机启动前应重点检查各安全保护装置和指示仪表应齐全完好，钢丝绳及连\n接部位应符合规定，燃油、润滑油、液压油及冷却水应添加充足等。&quot;,&quot;answer&quot;:&quot;A&quot;,&quot;leaf&quot;:&quot;lifting&quot;,&quot;numeric&quot;:false,&quot;flags&quot;:[&quot;原PDF存在相同题号的其他条目；用PDF页码区别&quot;]},{&quot;id&quot;:&quot;q1316&quot;,&quot;n&quot;:1217,&quot;page&quot;:190,&quot;type&quot;:&quot;判断&quot;,&quot;body&quot;:&quot;高处作业吊篮事故常常包括悬挂机构安装事故、钢丝绳绳端固定事故、钢丝绳非正常\n磨损事故、吊篮斜拉使用事故等。&quot;,&quot;answer&quot;:&quot;   &lt;script&gt;
    (() =&gt; {
      const root=document.getElementById(&#x27;a-cert-map&#x27;);
      const topics=JSON.parse(root.querySelector(&#x27;#a-topics-data&#x27;).textContent);
      const questions=JSON.parse(root.querySelector(&#x27;#a-questions-data&#x27;).textContent);
      const esc=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
      const byLeaf=new Map();
      const allLeaves=topics.flatMap(t=&gt;t.leaves.map(l=&gt;({...l,parent:t.name,parentId:t.id})));
      const getLeaf=id=&gt;allLeaves.find(l=&gt;l.id===id)||allLeaves[0];
      questions.forEach(q=&gt;{if(!byLeaf.has(q.leaf))byLeaf.set(q.leaf,[]);byLeaf.get(q.leaf).push(q);});
      let chosen=getLeaf(window.openai?.widgetState?.privateContent?.leaf||&#x27;owner&#x27;).id;
      const questionHtml=q=&gt;`&lt;details class=&quot;question&quot;&gt;&lt;summary&gt;${esc(q.type)} · 原题${q.n} · PDF第${q.page}页${q.flags.length?&#x27; · 原文需辨别&#x27;:&#x27;&#x27;}&lt;/summary&gt;&lt;div class=&quot;question-text&quot;&gt;${esc(q.body)}&lt;/div&gt;${q.flags.length?`&lt;div class=&quot;context-line text-small&quot;&gt;${q.flags.map(esc).join(&#x27;；&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}&lt;details&gt;&lt;summary&gt;查看题库参考答案&lt;/summary&gt;&lt;div&gt;${esc(q.type===&#x27;判断&#x27;?(q.answer===&#x27;A&#x27;?&#x27;对（A）&#x27;:q.answer===&#x27;B&#x27;?&#x27;错（B）&#x27;:q.answer):q.answer)}&lt;/div&gt;&lt;div class=&quot;text-small text-muted&quot;&gt;参考答案按原PDF保留，注意引用法规版本与题干条件。&lt;/div&gt;&lt;/details&gt;&lt;/details&gt;`;
      const questionGroup=(label,arr,open=false)=&gt;`&lt;details ${open?&#x27;open&#x27;:&#x27;&#x27;}&gt;&lt;summary&gt;${esc(label)} · ${arr.length}条&lt;/summary&gt;${arr.map(questionHtml).join(&#x27;&#x27;)}&lt;/details&gt;`;
      const save=()=&gt;{const api=window.openai;if(api?.setWidgetState)api.setWidgetState({modelContent:{selectedKnowledge:getLeaf(chosen).name},privateContent:{leaf:chosen}}).catch(()=&gt;{});};
      function show(id,persist=false){
        const leaf=getLeaf(id);chosen=leaf.id;
        root.querySelectorAll(&#x27;[data-leaf]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.leaf===chosen)));
        const matching=byLeaf.get(chosen)||[];
        const refs=questions.filter(q=&gt;leaf.refs.includes(q.n));
        const refIds=new Set(refs.map(q=&gt;q.id));
        const remaining=matching.filter(q=&gt;!refIds.has(q.id));
        root.querySelector(&#x27;#a-topic-detail&#x27;).innerHTML=`&lt;div class=&quot;path text-small&quot;&gt;A证 → ${esc(leaf.parent)} → ${esc(leaf.name)}&lt;/div&gt;&lt;h3&gt;${esc(leaf.name)}&lt;/h3&gt;&lt;ul class=&quot;concept-list&quot;&gt;${leaf.points.map(p=&gt;`&lt;li&gt;${esc(p)}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;&lt;div class=&quot;context-line&quot;&gt;&lt;strong&gt;例子&lt;/strong&gt; · ${esc(leaf.example)}&lt;/div&gt;&lt;div class=&quot;context-line&quot;&gt;&lt;strong&gt;易混&lt;/strong&gt; · ${esc(leaf.trap)}&lt;/div&gt;&lt;hr&gt;&lt;h3&gt;对应原题&lt;/h3&gt;${questionGroup(&#x27;先看这些代表题&#x27;,refs,true)}${remaining.length?questionGroup(&#x27;本知识点其他条目&#x27;,remaining):&#x27;&#x27;}`;
        if(persist)save();
      }
      root.querySelector(&#x27;#a-topic-nav&#x27;).innerHTML=`&lt;div&gt;&lt;strong&gt;A证知识树&lt;/strong&gt;&lt;/div&gt;${topics.map(t=&gt;`&lt;details class=&quot;tree-root&quot; ${t.id===getLeaf(chosen).parentId?&#x27;open&#x27;:&#x27;&#x27;}&gt;&lt;summary&gt;${esc(t.name)}&lt;/summary&gt;&lt;div class=&quot;tree-children&quot;&gt;${t.leaves.map(l=&gt;`&lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-leaf=&quot;${esc(l.id)}&quot; aria-pressed=&quot;${l.id===chosen}&quot;&gt;${esc(l.name)}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/details&gt;`).join(&#x27;&#x27;)}`;
      root.querySelector(&#x27;#a-topic-nav&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{const b=e.target.closest(&#x27;button[data-leaf]&#x27;);if(b)show(b.dataset.leaf,true);});
      const numeric=questions.filter(q=&gt;q.numeric);
      root.querySelector(&#x27;#a-number-bank&#x27;).innerHTML=topics.map(t=&gt;{const ids=new Set(t.leaves.map(l=&gt;l.id));const arr=numeric.filter(q=&gt;ids.has(q.leaf));return arr.length?questionGroup(t.name,arr):&#x27;&#x27;;}).join(&#x27;&#x27;);
      const issues=questions.filter(q=&gt;q.flags.length);
      root.querySelector(&#x27;#a-issue-bank&#x27;).innerHTML=questionGroup(&#x27;查看需辨别的原题&#x27;,issues);
      window.addEventListener(&#x27;openai:set_globals&#x27;,e=&gt;{const id=e.detail?.globals?.widgetState?.privateContent?.leaf;if(id&amp;&amp;id!==chosen)show(id);});
      show(chosen);
    })();
  &lt;/script&gt;

    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
